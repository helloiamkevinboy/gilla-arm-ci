name: gilla-dump
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL for the game APK"
        required: true
      android:
        description: "redroid android version"
        required: false
        default: "14.0.0-latest"

jobs:
  dump:
    runs-on: ubuntu-24.04-arm            # native arm64 (required: game is arm64-only)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Host info
        run: |
          uname -a
          echo "arch: $(dpkg --print-architecture)"
          find /lib/modules/$(uname -r) -name '*binder*' 2>/dev/null || true

      - name: Load binder + install tools
        run: |
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>&1 || echo "modprobe binder_linux FAILED"
          sudo modprobe ashmem_linux 2>&1 || echo "(ashmem not needed on new kernels)"
          ls -l /dev/binder* /dev/*binder* 2>/dev/null || echo "(no host /dev/binder; redroid --privileged provides it)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb xz-utils
          python3 -m pip install --quiet frida-tools
          frida --version

      - name: Start redroid (native arm64 Android)
        run: |
          mkdir -p ~/rd
          docker run -itd --rm --privileged --name redroid -v ~/rd:/data -p 5555:5555 \
            redroid/redroid:${{ github.event.inputs.android }} \
            androidboot.redroid_gpu_mode=guest androidboot.redroid_width=720 androidboot.redroid_height=1280
          sleep 15
          docker ps -a
          docker logs redroid 2>&1 | tail -30 || true

      - name: ADB connect + wait for boot
        run: |
          adb start-server
          adb connect localhost:5555 || true
          sleep 3
          adb connect localhost:5555
          for i in $(seq 1 60); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "try $i: boot=$b"
            [ "$b" = "1" ] && break
            sleep 5
          done
          echo "ABI: $(adb -s localhost:5555 shell getprop ro.product.cpu.abilist | tr -d '\r')"
          [ "$(adb -s localhost:5555 shell getprop sys.boot_completed | tr -d '\r')" = "1" ] || { echo "redroid did not boot"; exit 1; }

      - name: Install game
        run: |
          URL="${{ github.event.inputs.apk_url }}"
          if echo "$URL" | grep -q "drive.google.com"; then
            python3 -m pip install --quiet gdown
            ID=$(echo "$URL" | grep -oE '/d/[^/]+' | cut -d/ -f3)
            [ -z "$ID" ] && ID=$(echo "$URL" | grep -oE 'id=[^&]+' | cut -d= -f2)
            gdown "$ID" -O game.apk
          else
            curl -fL "$URL" -o game.apk
          fi
          ls -la game.apk; file game.apk
          adb -s localhost:5555 install -r -g game.apk

      - name: frida-server + dump
        run: |
          set -x
          FV=$(frida --version 2>/dev/null || echo 17.2.7)
          echo "frida version: $FV"
          curl -fL -o fs.xz "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-arm64.xz" || \
            curl -fL -o fs.xz "https://github.com/frida/frida/releases/download/17.2.7/frida-server-17.2.7-android-arm64.xz"
          xz -d fs.xz
          adb -s localhost:5555 root || true
          sleep 3
          adb -s localhost:5555 connect localhost:5555 || true
          adb -s localhost:5555 push fs /data/local/tmp/frida-server
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/frida-server
          adb -s localhost:5555 shell "setsid /data/local/tmp/frida-server >/data/local/tmp/fs.log 2>&1 &" || \
            ( adb -s localhost:5555 shell "/data/local/tmp/frida-server &" & )
          sleep 6
          echo "=== launch game (il2cpp_init runs early, before XR) ==="
          adb -s localhost:5555 logcat -c || true
          adb -s localhost:5555 shell am start -n com.playgilla.gilla/com.unity3d.player.UnityPlayerGameActivity || true
          for i in $(seq 1 30); do
            PID=$(adb -s localhost:5555 shell pidof com.playgilla.gilla | tr -d '\r')
            if [ -n "$PID" ] && adb -s localhost:5555 shell "cat /proc/$PID/maps 2>/dev/null | grep -q libil2cpp.so"; then
              echo "libil2cpp mapped in pid $PID after ${i}0s"; break
            fi
            sleep 10
          done
          echo "=== DUMP: locate class table + dump via calib4_agent.js ==="
          timeout 720 python3 -u driver2.py localhost:5555 com.playgilla.gilla calib4_agent.js gilla_dump.cs 660 2>&1 | tee dump_driver.log || echo "driver exit=$?"
          adb -s localhost:5555 logcat -d > logcat.txt 2>&1 || true
          echo "=== dump head ==="; head -40 gilla_dump.cs 2>/dev/null || echo "(no dump)"
          echo "=== dump size ==="; wc -l gilla_dump.cs 2>/dev/null || true

      - name: Validate (fail if no real dump)
        run: |
          test -s gilla_dump.cs || { echo "::error::gilla_dump.cs missing/empty"; exit 1; }
          CLS=$(grep -c 'class ' gilla_dump.cs || echo 0)
          echo "classes in dump: $CLS"
          [ "$CLS" -ge 1 ] || { echo "::error::no classes recovered"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gilla-dump
          path: |
            gilla_dump.cs
            dump_driver.log
            logcat.txt
          if-no-files-found: warn
