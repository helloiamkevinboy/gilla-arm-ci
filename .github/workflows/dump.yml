name: gilla-dump
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct download URL for the game APK"
        required: true
      android:
        description: "redroid android version"
        required: false
        default: "14.0.0-latest"

jobs:
  dump:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Host info
        run: |
          uname -a
          echo "arch: $(dpkg --print-architecture)"
          echo "--- binder modules available? ---"
          find /lib/modules/$(uname -r) -name '*binder*' 2>/dev/null || true

      - name: Load binder + install tools
        run: |
          sudo modprobe binder_linux devices=binder,hwbinder,vndbinder 2>&1 || echo "modprobe binder_linux FAILED"
          sudo modprobe ashmem_linux 2>&1 || echo "(ashmem not needed on new kernels)"
          echo "--- binder devices ---"
          ls -l /dev/binder* /dev/*binder* 2>/dev/null || echo "NO binder devices -> redroid will fail"
          sudo apt-get update -qq
          sudo apt-get install -y -qq adb xz-utils
          python3 -m pip install --quiet frida-tools
          frida --version

      - name: Start redroid (native arm64 Android)
        run: |
          mkdir -p ~/rd
          docker run -itd --rm --privileged \
            --name redroid \
            -v ~/rd:/data \
            -p 5555:5555 \
            redroid/redroid:${{ github.event.inputs.android }} \
            androidboot.redroid_gpu_mode=guest \
            androidboot.redroid_width=720 androidboot.redroid_height=1280
          echo "waiting for container..."
          sleep 15
          docker ps -a
          echo "--- redroid logs ---"; docker logs redroid 2>&1 | tail -30 || true

      - name: ADB connect + wait for boot
        run: |
          adb start-server
          adb connect localhost:5555 || true
          sleep 3
          adb connect localhost:5555
          echo "waiting boot_completed..."
          for i in $(seq 1 60); do
            b=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            echo "try $i: boot=$b"
            [ "$b" = "1" ] && break
            sleep 5
          done
          echo "=== ABI (want arm64-v8a, 64-bit) ==="
          adb -s localhost:5555 shell getprop ro.product.cpu.abi
          adb -s localhost:5555 shell getprop ro.product.cpu.abilist64

      - name: Install game
        run: |
          URL="${{ github.event.inputs.apk_url }}"
          echo "apk source: $URL"
          if echo "$URL" | grep -q "drive.google.com"; then
            python3 -m pip install --quiet gdown
            ID=$(echo "$URL" | grep -oE '/d/[^/]+' | cut -d/ -f3)
            [ -z "$ID" ] && ID=$(echo "$URL" | grep -oE 'id=[^&]+' | cut -d= -f2)
            echo "google drive id: $ID"
            gdown "$ID" -O game.apk
          else
            curl -fL "$URL" -o game.apk
          fi
          ls -la game.apk
          file game.apk
          adb -s localhost:5555 install -r -g game.apk

      - name: frida-server + dump
        run: |
          FV=$(frida --version 2>/dev/null || echo 17.2.7)
          echo "frida version: $FV"
          curl -fL -o fs.xz "https://github.com/frida/frida/releases/download/${FV}/frida-server-${FV}-android-arm64.xz" || \
            curl -fL -o fs.xz "https://github.com/frida/frida/releases/download/17.2.7/frida-server-17.2.7-android-arm64.xz"
          xz -d fs.xz
          adb -s localhost:5555 root || true
          sleep 3
          adb -s localhost:5555 connect localhost:5555 || true
          adb -s localhost:5555 push fs /data/local/tmp/frida-server
          adb -s localhost:5555 shell chmod 755 /data/local/tmp/frida-server
          adb -s localhost:5555 shell "setsid /data/local/tmp/frida-server >/dev/null 2>&1 &" || \
            adb -s localhost:5555 shell "/data/local/tmp/frida-server &" &
          sleep 6
          echo "=== DUMP: self-calibrating il2cpp dumper ==="
          python3 driver.py localhost:5555 com.playgilla.gilla calib_agent.js 2>&1 | tail -120

      - name: Pull artifacts
        if: always()
        run: |
          adb -s localhost:5555 pull /data/data/com.playgilla.gilla/exports.txt exports.txt 2>/dev/null && echo "got exports" || echo "no exports"
          adb -s localhost:5555 pull /data/data/com.playgilla.gilla/meta_region.dat meta_region.dat 2>/dev/null && echo "got meta_region" || echo "no meta_region"
          adb -s localhost:5555 pull /data/data/com.playgilla.gilla/gilla_dump.cs gilla_dump.cs 2>/dev/null || echo "no dump at app dir"
          adb -s localhost:5555 pull /data/local/tmp/gilla_dump.cs gilla_dump.cs 2>/dev/null || true
          ls -la exports.txt meta_region.dat gilla_dump.cs 2>/dev/null || true
          echo "--- redroid logs tail ---"; docker logs redroid 2>&1 | tail -15 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gilla-dump
          path: |
            exports.txt
            meta_region.dat
            gilla_dump.cs
          if-no-files-found: warn
